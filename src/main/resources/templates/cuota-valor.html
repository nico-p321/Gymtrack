<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Valor de cuota')}"></head>
<body class="min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="max-w-lg mx-auto px-4 sm:px-6 py-8">
    <div class="card p-6 sm:p-8">
        <h1 class="text-2xl font-extrabold text-white tracking-tight mb-6">Valor de la cuota mensual</h1>

        <!-- Muestra el valor actual si existe -->
        <div th:if="${montoActual}" class="mb-6 bg-lime-400/10 border border-lime-400/30 rounded-xl px-5 py-4">
            <p class="label text-lime-200/70">Valor actual</p>
            <p class="text-4xl font-extrabold text-lime-400" th:text="'$' + ${montoActual}"></p>
            <p class="text-xs text-zinc-400 mt-1">Vigente desde <span th:text="${vigenteDesde}"></span></p>
        </div>

        <!-- Mensaje si no hay valor configurado aún -->
        <div th:unless="${montoActual}" class="mb-6 bg-yellow-500/10 border border-yellow-500/30 rounded-xl px-4 py-3 text-sm text-yellow-300">
            Todavía no hay un valor de cuota configurado.
        </div>

        <!-- Formulario para actualizar el valor de la cuota -->
        <form th:action="@{/cuota-valor/guardar}" method="post" class="flex flex-col gap-3">
            <label class="label">Nuevo valor de cuota</label>
            <input type="number" step="0.01" name="monto" required placeholder="$ 0,00" class="input">
            <button type="submit" class="btn-primary mt-2 w-full">
                Guardar nuevo valor
            </button>
        </form>
    </div>
</main>
</body>
</html>
