<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo='Valor de cuota')}"></head>
<body class="bg-slate-50 min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="max-w-lg mx-auto p-6">
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-xl font-bold text-slate-800 mb-4">Valor de la cuota mensual</h1>

        <!-- Muestra el valor actual si existe -->
        <div th:if="${montoActual}" class="mb-6 bg-teal-50 border border-teal-200 rounded-lg px-4 py-3">
            <p class="text-sm text-slate-600">Valor actual</p>
            <p class="text-2xl font-bold text-teal-700" th:text="'$' + ${montoActual}"></p>
            <p class="text-xs text-slate-400 mt-1">Vigente desde <span th:text="${vigenteDesde}"></span></p>
        </div>

        <!-- Mensaje si no hay valor configurado aún -->
        <div th:unless="${montoActual}" class="mb-6 bg-yellow-50 border border-yellow-200 rounded-lg px-4 py-3 text-sm text-yellow-700">
            Todavía no hay un valor de cuota configurado.
        </div>

        <!-- Formulario para actualizar el valor de la cuota -->
        <form th:action="@{/cuota-valor/guardar}" method="post" class="flex flex-col gap-3">
            <label class="block text-sm font-medium text-slate-600">Nuevo valor de cuota</label>
            <input type="number" step="0.01" name="monto" required
                   class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium mt-2">
                Guardar nuevo valor
            </button>
        </form>
    </div>
</main>
</body>
</html>
