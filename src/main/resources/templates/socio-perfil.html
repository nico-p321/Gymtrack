<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head(titulo=${socio.nombre})}"></head>
<body class="bg-slate-50 min-h-screen">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="max-w-3xl mx-auto p-6 flex flex-col gap-6">

    <!-- Ficha del socio con estado de cuenta -->
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h1 class="text-2xl font-bold text-slate-800" th:text="${socio.nombre} + ' ' + ${socio.apellido}"></h1>
        <p class="text-sm text-slate-500 mt-1">Teléfono: <span th:text="${socio.telefono}"></span></p>
        <p class="text-sm text-slate-500">Email: <span th:text="${socio.email}"></span></p>
        <p class="text-sm text-slate-500">Objetivo:
            <span class="ml-2 px-2 py-1 rounded-full text-xs font-medium"
                  th:classappend="${socio.objetivo == null} ? 'bg-gray-100 text-gray-600' : 'bg-teal-100 text-teal-700'"
                  th:text="${socio.objetivoEtiqueta}"></span>
        </p>
        <a th:href="@{/socios/{id}/entrenos(id=${socio.idSocio})}"
           class="inline-block mt-3 bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
            Entrenamientos
        </a>
        <p class="mt-3">
            <span class="text-sm font-medium text-slate-600">Estado de la cuenta:</span>
            <span class="ml-2 px-2 py-1 rounded-full text-xs font-medium"
                  th:classappend="${estado == 'AL DÍA'} ? 'bg-green-100 text-green-700' : (${estado == 'VENCIDO'} ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-600')"
                  th:text="${estado}"></span>
        </p>
    </div>

    <!-- Objetivo del socio: se elige de una lista y queda vigente hasta que se cambie -->
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">Objetivo del socio</h2>

        <p th:if="${exitoObjetivo}" th:text="${exitoObjetivo}"
           class="bg-green-50 text-green-700 text-sm px-3 py-2 rounded mb-4"></p>
        <p th:if="${errorObjetivo}" th:text="${errorObjetivo}"
           class="bg-red-50 text-red-600 text-sm px-3 py-2 rounded mb-4"></p>

        <form th:action="@{/socios/{id}/objetivo(id=${socio.idSocio})}" method="post"
              class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Objetivo</label>
                <select name="objetivo"
                        class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
                    <option value="" th:selected="${socio.objetivo == null}">Sin definir</option>
                    <option th:each="opcion : ${objetivos}"
                            th:value="${opcion.name()}"
                            th:text="${opcion.etiqueta}"
                            th:selected="${socio.objetivo == opcion.name()}"></option>
                </select>
            </div>
            <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                Guardar objetivo
            </button>
        </form>
    </div>

    <!-- Formulario para registrar nuevo pago -->
    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">Registrar nuevo pago</h2>
        <form th:action="@{/socios/{id}/pagos/registrar(id=${socio.idSocio})}" method="post" class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Fecha de pago</label>
                <input type="date" name="fechaPago" required th:value="${hoy}"
                       class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Monto (opcional)</label>
                <input type="number" step="0.01" name="monto"
                       class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                Registrar pago
            </button>
        </form>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <h2 class="text-lg font-semibold text-slate-800 mb-4">Registrar medidas físicas</h2>

        <p th:if="${exitoMedida}" th:text="${exitoMedida}"
           class="bg-green-50 text-green-700 text-sm px-3 py-2 rounded mb-4"></p>
        <p th:if="${errorMedida}" th:text="${errorMedida}"
           class="bg-red-50 text-red-600 text-sm px-3 py-2 rounded mb-4"></p>

        <form th:action="@{/socios/{id}/medidas/guardar(id=${socio.idSocio})}" method="post"
              class="flex flex-wrap gap-4 items-end">
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Fecha</label>
                <input type="date" name="fecha" required th:value="${hoy}"
                       class="border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Peso (kg)</label>
                <input type="number" step="0.1" name="peso" required
                       class="w-28 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Altura (cm)</label>
                <input type="number" step="0.1" name="altura" required
                       class="w-28 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-slate-600 mb-1">Grasa corporal % (opcional)</label>
                <input type="number" step="0.1" name="grasaCorporal"
                       class="w-28 border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500">
            </div>
            <button type="submit" class="bg-teal-600 hover:bg-teal-700 text-white px-4 py-2 rounded-lg text-sm font-medium">
                Guardar medidas
            </button>
        </form>
    </div>

    <!-- Historial de pagos del socio -->
    <div class="bg-white rounded-lg shadow-sm overflow-hidden">
        <h2 class="text-lg font-semibold text-slate-800 px-6 pt-6">Historial de pagos</h2>
        <table class="w-full text-left border-collapse mt-4">
            <thead class="bg-slate-100">
            <tr>
                <th class="px-6 py-3 text-xs font-semibold text-slate-600 uppercase">Fecha de pago</th>
                <th class="px-6 py-3 text-xs font-semibold text-slate-600 uppercase">Monto</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="pago : ${pagos}" class="border-t hover:bg-slate-50">
                <td class="px-6 py-3 text-sm text-slate-700" th:text="${pago.fechaPago}"></td>
                <td class="px-6 py-3 text-sm text-slate-700" th:text="${pago.monto}"></td>
            </tr>
            </tbody>
        </table>
    </div>

    <a th:href="@{/socios}" class="text-slate-500 hover:text-slate-700 text-sm">&larr; Volver al listado</a>
</main>
</body>
</html>
