<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo} + ' · Gymtrack'">Gymtrack</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Tailwind CSS via CDN para estilos utilitarios -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'ui-sans-serif', 'system-ui', 'sans-serif'] }
                }
            }
        }
    </script>
    <!-- Componentes reutilizables del tema oscuro (negro + verde lima) -->
    <style type="text/tailwindcss">
        @layer base {
            html { color-scheme: dark; }
            body { @apply bg-neutral-950 text-zinc-100 font-sans antialiased; }
        }
        @layer components {
            .card { @apply bg-zinc-900 border border-zinc-800 rounded-2xl shadow-lg shadow-black/40; }
            .card-title { @apply text-base font-semibold text-white flex items-center gap-2; }
            .card-title::before { content: ''; @apply w-1 h-4 rounded-full bg-lime-400; }
            .label { @apply block text-xs font-medium text-zinc-400 mb-1.5 uppercase tracking-wide; }
            .input { @apply w-full bg-neutral-950 border border-zinc-700 rounded-lg px-3 py-2 text-sm text-zinc-100 placeholder-zinc-500
                            focus:outline-none focus:ring-2 focus:ring-lime-400/60 focus:border-lime-400 transition; }
            .btn { @apply inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-semibold transition; }
            .btn-primary { @apply btn bg-lime-400 text-black hover:bg-lime-300 shadow-md shadow-lime-400/20; }
            .btn-secondary { @apply btn bg-zinc-800 text-zinc-100 border border-zinc-700 hover:bg-zinc-700; }
            .badge { @apply inline-flex items-center whitespace-nowrap px-2.5 py-1 rounded-full text-xs font-semibold ring-1 ring-inset; }
            .badge-ok { @apply bg-lime-400/10 text-lime-300 ring-lime-400/30; }
            .badge-warn { @apply bg-orange-500/10 text-orange-300 ring-orange-500/30; }
            .badge-bad { @apply bg-red-500/10 text-red-400 ring-red-500/30; }
            .badge-muted { @apply bg-zinc-800 text-zinc-400 ring-zinc-700; }
            .alert-ok { @apply bg-lime-400/10 border border-lime-400/30 text-lime-300 text-sm px-3 py-2 rounded-lg; }
            .alert-bad { @apply bg-red-500/10 border border-red-500/30 text-red-400 text-sm px-3 py-2 rounded-lg; }
            .th { @apply px-4 py-3 whitespace-nowrap text-xs font-semibold text-zinc-400 uppercase tracking-wider; }
            .td { @apply px-4 py-3 text-sm text-zinc-300; }
            .link { @apply text-lime-400 hover:text-lime-300 hover:underline; }
        }
    </style>
</head>
<body>

<!-- Navbar compartida en todas las páginas -->
<nav th:fragment="navbar" class="sticky top-0 z-10 bg-black/90 backdrop-blur border-b border-zinc-800">
    <div class="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center gap-2 sm:gap-6 overflow-x-auto">
        <a th:href="@{/socios}" class="flex items-center gap-2 mr-2 sm:mr-4 shrink-0">
            <span class="w-8 h-8 rounded-lg bg-lime-400 text-black font-extrabold grid place-items-center text-sm">GT</span>
            <span class="font-extrabold text-lg tracking-tight text-white">Gym<span class="text-lime-400">track</span></span>
        </a>
        <a th:href="@{/socios}" class="text-sm text-zinc-300 hover:text-lime-400 transition whitespace-nowrap">Socios</a>
        <a th:href="@{/socios/nuevo}" class="text-sm text-zinc-300 hover:text-lime-400 transition whitespace-nowrap">+ Nuevo socio</a>
        <a th:href="@{/cuota-valor}" class="text-sm text-zinc-300 hover:text-lime-400 transition whitespace-nowrap">Valor de cuota</a>
    </div>
</nav>

</body>
</html>
