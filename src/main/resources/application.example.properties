spring.application.name=Gimansio

spring.datasource.url=jdbc:mysql://localhost:3306/gymtrack
spring.datasource.username="TU USUARIO"
spring.datasource.password="TU_PASSWORD"
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# IA (OpenRouter). La clave NO va en este archivo: se lee de la variable de entorno OPENROUTER_API_KEY.
# Conseguí una clave gratuita en https://openrouter.ai/keys
# Modelos de chat gratuitos separados por coma: si uno no está disponible, OpenRouter usa el siguiente.
# Lista actual en https://openrouter.ai/models?max_price=0
ia.modelos=nvidia/nemotron-3.5-lightning:free,google/gemma-4-31b-it:free,google/gemma-4-26b-a4b-it:free
ia.timeout-segundos=30
